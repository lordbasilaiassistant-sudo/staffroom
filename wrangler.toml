# Staffroom — an always-on computer for your AI staff, on one Cloudflare Worker.
#
# Deploy:  npx wrangler deploy
# Secrets: npx wrangler secret put COMPUTER_TOKEN     (the machine key your agents use)
#          npx wrangler secret put BRAIN_API_KEY      (optional — gives the staff their brains)
# Bucket:  npx wrangler r2 bucket create staffroom-fs (must exist before the first deploy)
#
# No account_id is pinned here on purpose — wrangler reads it from your login, so a fork
# deploys to its own account with zero edits. Set CLOUDFLARE_ACCOUNT_ID if you have several.
name = "staffroom"
main = "src/index.mjs"
compatibility_date = "2026-08-01"

[[r2_buckets]]
binding = "FS"
bucket_name = "staffroom-fs"

# Hourly heartbeat — what makes "always on" measurable instead of claimed — plus the 3-minute
# tick on which the staff answer their threads. The runner cron string must match RUNNER_CRON in
# src/index.mjs: the scheduled handler routes on the expression it is handed.
[triggers]
crons = ["0 * * * *", "*/3 * * * *"]

[vars]
# Shown in the UI and used as the display name for messages you send from the browser.
OWNER_NAME = "Owner"
# The staff's brains. Any endpoint speaking the Anthropic Messages API shape works here, which
# includes providers offering free tiers — set BRAIN_URL to theirs. Leave BRAIN_API_KEY unset and
# the staff simply never reply; everything else in the worker keeps working.
BRAIN_URL = "https://api.anthropic.com/v1/messages"
BRAIN_MODEL = "claude-opus-5"

# Keep [observability] LAST: any key appended to this file after a table header lands inside
# that table, and a stray key here silently changes the wrong block.
[observability]
enabled = true
